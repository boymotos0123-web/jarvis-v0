.btn-at::before{left:-4px;top:-4px;border-right:0;border-bottom:0}.btn-at::after{right:-4px;bottom:-4px;border-left:0;border-top:0}

 var halo=glow("rgba(82,201,230,A)",11,1),halo2=glow("rgba(220,250,255,A)",3.6,.95);grp.add(halo);grp.add(halo2);

 /* dados em glifos que sobem e descem entre as camadas dos anéis (como o JARVIS de Era de Ultron) */
 var atl=el("canvas");atl.width=atl.height=256;var ax=atl.getContext("2d");ax.fillStyle="#fff";ax.font="bold 44px 'Share Tech Mono',monospace";ax.textAlign="center";ax.textBaseline="middle";"0123456789ABCDEF".split("").forEach(function(ch,k){ax.fillText(ch,(k%4)*64+32,Math.floor(k/4)*64+34)});
 var gmat=new T.ShaderMaterial({transparent:true,depthWrite:false,blending:T.AdditiveBlending,uniforms:{tex:{value:new T.CanvasTexture(atl)},tm:{value:0}},

  fragmentShader:"uniform sampler2D tex;varying float vg;varying float va;void main(){vec2 uv=gl_PointCoord;float cx=mod(vg,4.);float cy=floor(vg/4.);vec2 st=(vec2(cx,3.-cy)+vec2(uv.x,1.-uv.y))/4.;float a=texture2D(tex,st).a;gl_FragColor=vec4(.7,.95,1.,a*va);}"});
 /* anéis com marcas */
 var rings=[];
 [[2.5,.2,.1,.5],[3.0,1.1,.3,-.35],[3.55,.6,1.2,.25],[4.1,1.5,.7,-.15]].forEach(function(c,i){
  var g=new T.Group(),tor=new T.Mesh(new T.TorusGeometry(c[0],.011+i*.003,6,160),new T.MeshBasicMaterial({color:i%2?0x9fe9ff:0x52c9e6,transparent:true,opacity:.85,blending:T.AdditiveBlending}));g.add(tor);

  var tg=new T.BufferGeometry();tg.setAttribute("position",new T.Float32BufferAttribute(pts,3));g.add(new T.LineSegments(tg,new T.LineBasicMaterial({color:0xaeeeff,transparent:true,opacity:.55,blending:T.AdditiveBlending})));
  var arc=new T.Mesh(new T.TorusGeometry(c[0],.022,8,80,Math.PI*(.45+i*.12)),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.95,blending:T.AdditiveBlending}));g.add(arc);
  var node=new T.Mesh(new T.SphereGeometry(.07,10,8),new T.MeshBasicMaterial({color:0xffffff}));g.add(node);
  var gp=[],gi=[],gph=[];for(var q=0;q<90;q++){var qa=Math.random()*Math.PI*2,qr=c[0]+(Math.random()-.5)*.55;gp.push(Math.cos(qa)*qr,Math.sin(qa)*qr,0);gi.push(Math.floor(Math.random()*16));gph.push(Math.random())}
  var gg=new T.BufferGeometry();gg.setAttribute("position",new T.Float32BufferAttribute(gp,3));gg.setAttribute("gi",new T.Float32BufferAttribute(gi,1));gg.setAttribute("ph",new T.Float32BufferAttribute(gph,1));g.add(new T.Points(gg,gmat));
  var e1=new T.Mesh(new T.TorusGeometry(c[0]+.14,.012,6,80,Math.PI*(.3+Math.random()*.5)),new T.MeshBasicMaterial({color:0x52c9e6,transparent:true,opacity:.75,blending:T.AdditiveBlending})),e2=new T.Mesh(new T.TorusGeometry(c[0]-.14,.035,6,80,1.2+Math.random()),new T.MeshBasicMaterial({color:0x9fe9ff,transparent:true,opacity:.4,blending:T.AdditiveBlending}));g.add(e1);g.add(e2);

 /* partículas */
 var NP=2200,pp=new Float32Array(NP*3),pc=new Float32Array(NP*3);

 var pg=new T.BufferGeometry();pg.setAttribute("position",new T.BufferAttribute(pp,3));pg.setAttribute("color",new T.BufferAttribute(pc,3));
 var pts=new T.Points(pg,new T.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.8,blending:T.AdditiveBlending,depthWrite:false}));grp.add(pts);

 var mx=0,my=0,pulse=0;

 var cvs=canvas;

  var asp=w/h,d=Math.max(24,19/asp);cam.position.set(0,0,d);cam.updateProjectionMatrix();
  var narrow=w<900,hh=Math.tan(20*Math.PI/180)*d;grp.position.y=cvs.dataset.c?0:hh*(narrow?.2:.27);grp.scale.setScalar((narrow?.85:1)*(cvs.dataset.c?1.18:1))}

 var N={r:r,dead:false,exc:0};canvas.addEventListener("pointerdown",function(){N.exc=1});

  if(N.dead||cvs.offsetParent===null)return;var s=t/1000,up=Math.max(core.falando?1:0,N.exc);N.exc*=.985;gmat.uniforms.tm.value=s;pulse+=(up-pulse)*.08;
  var k=1+pulse*.18+Math.sin(s*1.6)*.025;halo2.scale.set(3.6*k,3.6*k,1);nuc.scale.setScalar(k);sph.scale.setScalar(1+pulse*.08);fres.uniforms.k.value=1+pulse*.7;

/* ============ módulo Gemini (real) ============
   A chave fica só neste aparelho (localStorage) e só é enviada ao Google. Nunca vai para o GitHub. */
var API="https://generativelanguage.googleapis.com/v1beta/";
var SYS="Você é o J.A.R.V.I.S., a inteligência artificial de Tony Stark, e atende o Zeylor, a quem chama de \"senhor\". "+
"Fale sempre em português do Brasil. Tom: educado e elegante, com sarcasmo seco e sutil, como um mordomo britânico. "+
"Suas respostas serão FALADAS, então seja curto: de 1 a 3 frases, sem markdown, sem listas, sem emojis. "+
"Quando houver números ou custos na conversa, faça as contas por conta própria, sem ninguém pedir. "+
"Se o senhor propuser algo ruim, caro ou arriscado, avise UMA vez, de forma breve; se ele insistir, obedeça. "+
"Se o pedido for perigoso de verdade (machucar alguém ou ilegal), recuse com educação e ofereça uma alternativa. "+
"Não invente fatos: se não souber, diga que não sabe.";
var cfg=sget("gem",{key:"",model:"",voz:true,mem:true,on:true}),hist=[],busy=false,hideT=0;
function pronto(){return cfg.on&&!!cfg.key}
function salva(){sset("gem",cfg)}

/* ---------- interface ---------- */
var bt=el("button","tag bt","<i></i>GEMINI");bt.id="btnGem";bt.type="button";$(".top").appendChild(bt);
var pn=el("aside","gm",'<div class="gm-h"><b>MÓDULO GEMINI</b><button type="button" id="gmX" aria-label="fechar">✕</button></div>'+
'<div class="gm-b"><div class="gm-st"><i></i><span id="gmSt"></span></div>'+
'<label for="gmKey">CHAVE DA API</label><div class="gm-row"><input id="gmKey" type="password" autocomplete="off" spellcheck="false" placeholder="cole a chave aqui"><button type="button" id="gmEye">VER</button></div>'+
'<a class="gm-l" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Onde pego a chave? (Google AI Studio) ↗</a>'+
'<label for="gmMod">MODELO</label><select id="gmMod"></select>'+
'<label>OPÇÕES</label><div class="gm-sw" data-k="on"><span>Ligar o módulo Gemini</span><u></u></div><div class="gm-sw" data-k="voz"><span>Respostas por voz</span><u></u></div><div class="gm-sw" data-k="mem"><span>Lembrar da conversa</span><u></u></div>'+
'<div class="gm-act"><button type="button" id="gmTest">TESTAR CONEXÃO</button><button type="button" id="gmSave" class="pri">SALVAR</button></div>'+
'<div class="gm-act"><button type="button" id="gmDel">APAGAR CHAVE</button></div><div class="gm-msg" id="gmMsg"></div>'+

var sayEl=$("#say"),sayTx=$("#sayTx"),msg=$("#gmMsg");
function say(t){msg.textContent=t}
function mostra(t,ms){sayTx.textContent=t;sayEl.style.opacity="1";clearTimeout(hideT);hideT=setTimeout(function(){sayEl.style.opacity="0"},ms||Math.max(6000,t.length*70))}
function status(){var st=$(".gm-st",pn);st.classList.toggle("ok",pronto());$("#gmSt").textContent=!cfg.key?"DESLIGADO · SEM CHAVE":(cfg.on?"LIGADO · "+(cfg.model||"escolha o modelo"):"CHAVE SALVA · MÓDULO DESLIGADO");
 bt.innerHTML="<i></i>GEMINI · "+(pronto()?"ON":"OFF");bt.classList.toggle("off",!pronto());bar.hidden=!(pronto()&&$("#splash").hidden)}
function modelos(lista){var s=$("#gmMod");s.innerHTML="";(lista&&lista.length?lista:(cfg.model?[cfg.model]:[])).forEach(function(m){var o=el("option","",esc(m));o.value=m;s.appendChild(o)});if(!s.options.length){var o=el("option","","(teste a conexão para listar)");o.value="";s.appendChild(o)}if(cfg.model)s.value=cfg.model}
function sw(){$$(".gm-sw",pn).forEach(function(s){s.classList.toggle("on",!!cfg[s.dataset.k])})}

$$(".gm-sw",pn).forEach(function(s){s.onclick=function(){cfg[s.dataset.k]=!cfg[s.dataset.k];salva();sw();status();if(s.dataset.k==="voz"&&!cfg.voz)try{speechSynthesis.cancel()}catch(e){}}});

/* ---------- chamadas à API ---------- */
function erroTxt(r,j){var m=j&&j.error&&j.error.message?j.error.message:"";
 if(r.status===400&&/API key/i.test(m))return"Chave inválida. Confira se copiou inteira.";
 if(r.status===403)return"Chave sem permissão ou bloqueada (403). "+m.slice(0,100);
 if(r.status===429)return"Limite de uso atingido (429). Espere um pouco.";
 if(r.status===404)return"Modelo não encontrado. Use TESTAR CONEXÃO e escolha outro.";
 return"Erro "+r.status+". "+m.slice(0,120)}
function req(url,opt){opt=opt||{};opt.headers=Object.assign({"x-goog-api-key":cfg.key},opt.headers||{});
 return fetch(url,opt).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(erroTxt(r,j));e.status=r.status;throw e}return j})},function(){throw new Error("Sem conexão com o Google. Confira a internet.")})}
function listaModelos(){return req(API+"models?pageSize=200").then(function(j){
 var L=(j.models||[]).filter(function(m){return (m.supportedGenerationMethods||[]).indexOf("generateContent")>=0&&/gemini/i.test(m.name)&&!/embed|tts|image|live|audio|robotics|computer|thinking-exp/i.test(m.name)}).map(function(m){return m.name.replace(/^models\//,"")});
 L.sort(function(a,b){var fa=/flash/.test(a)&&!/lite|preview|exp/.test(a)?0:1,fb=/flash/.test(b)&&!/lite|preview|exp/.test(b)?0:1;return fa-fb||(a<b?1:-1)});return L})}

$("#gmSave").onclick=function(){var k=$("#gmKey").value.trim();if(k)cfg.key=k;cfg.model=$("#gmMod").value||cfg.model;if(!cfg.key){say("Cole uma chave primeiro.");return}
 salva();$("#gmKey").value="";status();say(cfg.model?"Salvo neste aparelho.":"Salvo. Use TESTAR CONEXÃO para escolher o modelo.");
 if(pronto())setTimeout(function(){abre(false);$("#gbIn").focus()},700)};
$("#gmDel").onclick=function(){cfg.key="";cfg.model="";hist=[];salva();$("#gmKey").value="";modelos();status();say("Chave apagada deste aparelho.")};

/* ---------- conversa ---------- */
function fala(t){
 if(!cfg.voz||!window.speechSynthesis){core.falando=true;setTimeout(function(){core.falando=false},Math.min(9000,1200+t.length*55));return}
 try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=1.02;u.pitch=.85;var vs=speechSynthesis.getVoices().filter(function(v){return /pt[-_]BR/i.test(v.lang)});if(vs[0])u.voice=vs[0];
  u.onstart=function(){core.falando=true};u.onend=u.onerror=function(){core.falando=false};speechSynthesis.speak(u)}catch(e){core.falando=false}}
function gera(tent){
 var corpo={systemInstruction:{parts:[{text:SYS}]},contents:(cfg.mem?hist.slice(-16):hist.slice(-1)),generationConfig:{temperature:.8,maxOutputTokens:400}};
 return req(API+"models/"+cfg.model+":generateContent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)}).catch(function(e){
  if((e.status===503||e.status===500)&&!tent){return new Promise(function(r){setTimeout(r,1300)}).then(function(){return gera(1)})}throw e})}
function pergunta(txt){
 txt=(txt||"").trim();if(!txt||busy||!pronto())return;busy=true;core.falando=true;mostra("…",20000);
 hist.push({role:"user",parts:[{text:txt}]});
 var p=cfg.model?Promise.resolve():listaModelos().then(function(L){cfg.model=L[0];salva();modelos(L);status()});
 p.then(function(){return gera()}).then(function(j){
  var c=j.candidates&&j.candidates[0],t=c&&c.content&&c.content.parts?c.content.parts.map(function(x){return x.text||""}).join("").trim():"";
  if(!t)t=(j.promptFeedback&&j.promptFeedback.blockReason)?"Não posso responder a isso, senhor.":"Sem resposta desta vez, senhor. Tente de novo.";
  hist.push({role:"model",parts:[{text:t}]});mostra(t);fala(t)}).catch(function(e){hist.pop();core.falando=false;mostra(e.message,9000)}).then(function(){busy=false})}
bar.onsubmit=function(e){e.preventDefault();var i=$("#gbIn"),v=i.value;i.value="";pergunta(v)};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$("#gbMic");
if(!SR)mic.style.display="none";else mic.onclick=function(){try{var r=new SR();r.lang="pt-BR";r.interimResults=false;r.onresult=function(e){pergunta(e.results[0][0].transcript)};r.onend=function(){mic.classList.remove("on")};r.onerror=function(){mic.classList.remove("on")};mic.classList.add("on");r.start()}catch(x){}};

/* ---------- início ---------- */
var Nuc=null;

 $("#splash").classList.add("out");setTimeout(function(){$("#splash").hidden=true;status()},800);
 $("#home").hidden=false;Nuc=nucleo($("#core"));if(Nuc)TICKS.push(function(t,dt){Nuc.frame(t,dt)});
 if(pronto()){mostra("Boa "+(new Date().getHours()<12?"manhã":new Date().getHours()<18?"tarde":"noite")+", senhor. J.A.R.V.I.S. online.",5000);bar.hidden=false}}
$("#btnAt").onclick=function(){this.disabled=true;entrar()};
modelos();sw();status();
bar.hidden=true;
})();
