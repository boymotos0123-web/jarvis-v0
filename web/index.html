/* ---------- SPLASH ---------- */

.reator i:nth-child(2){inset:14%;border-style:dashed;animation:rot 14s linear infinite}
.reator i:nth-child(3){inset:28%;border-width:3px;animation:rot 8s linear infinite reverse;border-color:var(--ice) transparent var(--ice) transparent}
.reator b{position:absolute;inset:42%;border-radius:50%;background:radial-gradient(circle,#fff,#7fe3ff 55%,transparent 72%);animation:bat 2.4s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes bat{50%{transform:scale(1.25);opacity:.8}}
.sp-t{font:600 30px var(--head);letter-spacing:.55em;margin-right:-.55em;color:var(--ice)}

.btn-at::before,.btn-at::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--ice)}
.btn-at::before{left:-4px;top:-4px;border-right:0;border-bottom:0}.btn-at::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
.sp-s{font:11px var(--mono);letter-spacing:.2em;color:var(--mute);min-height:60px;text-align:left;line-height:1.7}
.sp-s div{opacity:0;animation:fi .3s forwards}@keyframes fi{to{opacity:1}}
.sp-s .ok{color:var(--teal2)}
/* ---------- HOME ---------- */
#home{background:radial-gradient(ellipse at 50% 38%,#07232f 0%,#031018 55%,#02070b 100%)}
#core{position:absolute;inset:0;width:100%;height:100%;display:block}

.brand{font:700 20px var(--head);letter-spacing:.5em}
.top .sp{flex:1}.tag{font:11px var(--mono);letter-spacing:.14em;color:var(--mute);display:flex;align-items:center;gap:7px;border:1px solid rgba(82,201,230,.25);padding:4px 11px;border-radius:99px;background:rgba(2,12,18,.55);backdrop-filter:blur(4px)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}.tag.off i{background:#586b75;box-shadow:none}

.car{position:absolute;left:0;right:0;bottom:56px;height:var(--car-h,250px);z-index:4;display:flex;flex-direction:column;justify-content:flex-end}
.car-hd{display:flex;align-items:center;gap:12px;padding:0 max(20px,env(safe-area-inset-left,0px));font:11px var(--mono);letter-spacing:.26em;color:var(--mute);margin-bottom:6px}
.car-hd .sp{flex:1}.car-hd button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(82,201,230,.4);background:rgba(2,12,18,.6);color:var(--ice)}.car-hd button:hover{border-color:var(--ice)}

.mini .h{position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#1b7f9f,#2aa5c6,#1b7f9f)}
.mini s{position:absolute;display:block;border:1px solid rgba(82,201,230,.55);background:rgba(10,60,82,.45)}

.mini em{position:absolute;display:block;height:2px;background:rgba(201,243,251,.55)}

.cmd{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;gap:10px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(2,7,11,.95),rgba(2,7,11,.55) 70%,transparent)}

#appRoot{position:relative;min-height:0;overflow:hidden}
/* ---------- KIT FILME ---------- */
.fl{position:absolute;inset:0;padding:0;background:
 linear-gradient(rgba(82,201,230,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(82,201,230,.045) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(ellipse at 50% 40%,#082432,#02090e 70%)}

.ab{position:absolute}

.bd{position:relative;flex:1;min-height:0;overflow:hidden}
.vw{position:absolute;inset:0}.vw canvas{display:block;width:100%;height:100%}
.wl{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.wl i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}

.cota{position:absolute;font:9px var(--mono);color:var(--orange);letter-spacing:.06em;white-space:nowrap}

.bars{display:grid;gap:5px;padding:8px}.bars div{display:grid;grid-template-columns:62px 1fr 34px;gap:6px;align-items:center;font:9px var(--mono);letter-spacing:.1em;color:var(--mute)}
.bars i{display:block;height:6px;background:rgba(82,201,230,.18);position:relative}.bars i b{position:absolute;left:0;top:0;bottom:0;background:var(--teal2);transition:width .6s}
.seg{display:flex;gap:2px;height:8px}.seg i{flex:1;background:rgba(82,201,230,.18)}.seg i.on{background:var(--teal2)}.seg i.w{background:#fff}
.bez{border:10px solid #14181b;border-radius:6px;background:#010508;box-shadow:0 0 0 1px #2b3236,0 18px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(82,201,230,.12);overflow:hidden}
